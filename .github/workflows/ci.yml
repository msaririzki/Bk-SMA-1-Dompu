name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bk_test
          MYSQL_USER: bk_test
          MYSQL_PASSWORD: bk_test_secret
          MYSQL_ROOT_PASSWORD: root_test_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_test_secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bk_test
      DB_USERNAME: bk_test
      DB_PASSWORD: bk_test_secret

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, dom, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --seed --force

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Check formatting and dependencies
        run: |
          vendor/bin/pint --test
          composer audit --no-interaction
          npm audit --omit=dev --audit-level=high

      - name: Run application tests
        run: php artisan test
